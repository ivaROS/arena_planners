[project]
name = "arena_planners_crowdnav"
version = "0.0.0"
description = "CrowdNav planner wrapper for the arena_planners bridge."
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "torch>=1.9",
    "numpy>=1.21,<2",
    "gym>=0.21",
    "scipy>=1.7",
]

[tool.uv.sources]
# Pin to OUR ivaROS fork at the exact submodule commit (2-endpoint bridge), NOT
# upstream's moving `jazzy` branch, so the planner-venv bridge protocol stays
# identical to the host edge_node. Bump `rev` to the submodule HEAD when advanced.
arena_planners = { git = "https://github.com/ivaROS/arena_planners.git", rev = "a3a491ac297a7f0bd7e812c6adf2c37d1e497297", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []
